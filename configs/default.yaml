# All dates and signal directions fixed before looking at crisis returns.
seed: 7
beta_window: ["2021-01-01", "2023-03-03"]   # weekly returns used to estimate rate betas
asof_balance_sheet: "2022-12-31"           # FY2022 balance sheet: in Q4 earnings releases (Jan 2023) and 10-Ks
deposit_base_date: "2020-12-31"            # FY2020 annual: deposit growth 2020-22 (hot-money proxy)
strict_lag:
  asof_balance_sheet: "2021-12-31"         # robustness: FY2021, public a full year before the crisis
  deposit_base_date: "2020-12-31"
crisis: ["2023-03-08", "2023-05-04"]       # close before SVB news -> regional-bank low
placebo: ["2022-03-08", "2022-05-04"]      # same calendar window one year earlier
episode2:
  asof_balance_sheet: "2022-12-31"         # same year-end figures, now fully public
  beta_window: ["2021-08-01", "2023-08-11"]
  window: ["2023-08-15", "2023-10-27"]     # 10-year yield run to 5%
min_price: 2.0
min_weeks: 80
# +1: higher value expected to mean a worse crisis return
directions:
  securities_share: 1
  aoci_to_equity: -1
  deposit_growth: 1
  rate_beta: -1
illustrative_book_usd: 1.0e9
